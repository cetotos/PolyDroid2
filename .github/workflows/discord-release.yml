name: discord-release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to announce
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Discord release message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --json name,tagName,body,publishedAt,url > release.json
          export RELEASE_TITLE=$(jq -r '.name' release.json)
          export VERSION=$(jq -r '.tagName' release.json)
          export RELEASE_BODY=$(jq -r '.body' release.json)
          export PUBLISHED_DATE=$(jq -r '.publishedAt' release.json)
          export RELEASE_URL=$(jq -r '.url' release.json)
          python3 - <<'PY' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
          import json, os, re
          from datetime import datetime

          with open('.github/workflows/payload.txt') as f:
              tmpl = f.read()

          def esc(s):
              return json.dumps(s or "")[1:-1]

          ts = int(datetime.fromisoformat(
              os.environ['PUBLISHED_DATE'].replace('Z', '+00:00')
          ).timestamp())

          repls = {
              'RELEASE_TITLE':  esc(os.environ.get('RELEASE_TITLE') or os.environ['VERSION']),
              'RELEASE_BODY':   esc(os.environ['RELEASE_BODY']),
              'RELEASE_URL':    esc(os.environ['RELEASE_URL']),
              'UNIX_TIMESTAMP': str(ts),
          }
          out = re.sub('|'.join(map(re.escape, repls)),
                       lambda m: repls[m.group()],
                       tmpl)

          json.loads(out)
          print(out, end='')
          PY
